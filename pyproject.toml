[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-automation"
version = "1.0.0"
description = "Media Discovery, Metadata & Publishing Automation Platform - Python Workers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Media Automation Team", email = "team@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "asyncio-throttle>=1.0.2",
    "tenacity>=8.2.3",
    "yt-dlp>=2024.1.0",
    "ffmpeg-python>=0.2.0",
    "aiosqlite>=0.19.0",
    "sqlalchemy>=2.0.0",
    "structlog>=24.1.0",
    "python-dateutil>=2.8.2",
    "python-magic>=0.4.27",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx-mock>=0.11.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]
ai = [
    "openai>=1.20.0",
    "anthropic>=0.20.0",
    "replicate>=0.20.0",
]
cloud = [
    "boto3>=1.34.0",
    "google-cloud-storage>=2.15.0",
]

[project.urls]
Homepage = "https://github.com/example/media-automation"
Repository = "https://github.com/example/media-automation"
Issues = "https://github.com/example/media-automation/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
per-file-ignores = { "tests/*" = ["S101", "S106"] }

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "discovery*", "sources*", "downloader*", "metadata*", "ai_generation*", "media_validation*", "processors*", "uploaders*", "scheduler*"]